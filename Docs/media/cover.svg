<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">Mi Tensión — Tu rutina, más clara</title>
  <desc id="desc">Presentación de la app iOS: registro local, histórico, informes y Excel. Versión de prueba.</desc>
  <defs>
    <clipPath id="frame"><rect width="1280" height="440" rx="28"/></clipPath>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#103b36"/><stop offset="1" stop-color="#082421"/></linearGradient>
  </defs>
  <rect width="1280" height="440" rx="28" fill="url(#bg)"/>
  <g clip-path="url(#frame)">
    <circle cx="1150" cy="70" r="260" fill="#7fdbc3" opacity=".06"/>
    <circle cx="1080" cy="390" r="210" fill="#7fdbc3" opacity=".06"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="64" y="48" width="332" height="34" rx="17" fill="#25544b"/>
    <text x="84" y="71" font-size="15" font-weight="700" fill="#b6eedb" letter-spacing="1.2" textLength="242" lengthAdjust="spacingAndGlyphs">IOS · LOCAL · SIMPLE</text>
    <text x="64" y="161" font-size="68" font-weight="700" fill="#f6fff9">Mi Tensión</text>
    <text x="67" y="215" font-size="30" fill="#b6eedb">Tu rutina, más clara.</text>
    <text x="67" y="269" font-size="21" fill="#d7e9e2">Registra tus tomas. Entiende tu histórico.</text>
    <text x="67" y="300" font-size="21" fill="#d7e9e2">Prepara tu próxima consulta.</text>
    <rect x="64" y="350" width="148" height="38" rx="19" fill="#b6eedb"/>
    <text x="85" y="375" font-size="15" font-weight="700" fill="#123c34">SIN CUENTAS</text>
    <text x="234" y="375" font-size="16" fill="#d7e9e2">Excel · PDF · 10 idiomas</text>
    <rect x="835" y="113" width="363" height="222" rx="24" fill="#f1faf5"/>
    <text x="863" y="153" font-size="15" font-weight="700" fill="#45695e" textLength="300" lengthAdjust="spacingAndGlyphs">UN HÁBITO A TU RITMO</text>
    <path d="M863 218h58l18-26 24 61 28-79 25 44h154" fill="none" stroke="#23856b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="863" y="288" font-size="20" font-weight="700" fill="#183e34">Mañana y noche, en orden.</text>
    <text x="863" y="313" font-size="15" fill="#45695e">Tus registros permanecen en tu móvil.</text>
    <text x="1198" y="398" font-size="14" text-anchor="end" fill="#b6eedb">EN DESARROLLO · IOS 17+</text>
  </g>
</svg>
